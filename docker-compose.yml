version: '3.8'

services:
  recruiter-app:
    env_file:
      - .env.local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_AZURE_CLIENT_ID
        - NEXT_PUBLIC_AZURE_TENANT_ID
        - NEXT_PUBLIC_API_BASE_URL
        - NEXT_PUBLIC_APP_IDENTIFIER
        - NEXT_PUBLIC_APP_URL=https://recruiter-f.rnd.2bv.io
        - NEXT_PUBLIC_REDIRECT_URI=https://recruiter-f.rnd.2bv.io/
        - TEAMTAILOR_API_KEY
        - OPENAI_API_KEY
        - GEMINI_API_KEY
        - NEXT_PUBLIC_TESTDOME_API_KEY
        - NEXT_PUBLIC_TESTDOME_ACCOUNT
        - NEXT_PUBLIC_SUPER_ADMIN_EMAILS
        - NEXT_PUBLIC_SUPER_ADMIN_OIDS
        - NEXT_PUBLIC_APP_ID
        - NEXT_PUBLIC_APP_NAME
        - NEXT_PUBLIC_DEFAULT_USER_ROLE
        - NEXT_PUBLIC_DEFAULT_ROLE
        - NEXT_PUBLIC_AUTO_PROVISION_USERS
        - NEXT_PUBLIC_REQUIRE_EXPLICIT_ACCESS
        - NEXT_PUBLIC_ENABLE_USER_REGISTRATION
        - NEXT_PUBLIC_ENABLE_AUDIT_LOGGING
        - NEXT_PUBLIC_PERMISSION_CACHE_TTL
        - NEXT_PUBLIC_MAX_ROLES_PER_USER
    container_name: recruiter-f-2bv
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # Docker/Production Configuration
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
      # nginx-proxy Configuration  
      - VIRTUAL_HOST=recruiter-f.rnd.2bv.io
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=recruiter-f.rnd.2bv.io
      - LETSENCRYPT_EMAIL=peter.esquilla@simplyautomate.ai
      
      # Production Overrides (everything else comes from .env.local)
      - NEXT_PUBLIC_APP_URL=https://recruiter-f.rnd.2bv.io/
      - NEXT_PUBLIC_REDIRECT_URI=https://recruiter-f.rnd.2bv.io/
      - NEXTAUTH_URL=https://recruiter-f.rnd.2bv.io
      - NEXTAUTH_SECRET=recruiter-2bv-nextauth-secret-production-key-32chars
      
    expose:
      - "3000"
    volumes:
      # Mount logs directory for persistent logging
      - ./logs:/app/logs
      # Mount uploads directory if needed for file uploads
      - ./uploads:/app/uploads
    networks:
      - nginx-proxy
      - default
    labels:
      # nginx-proxy labels for automatic configuration
      - "traefik.enable=false"
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - redis
      
  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: recruiter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - default
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  redis_data:
    driver: local

networks:
  nginx-proxy:
    external: true
  default:
    driver: bridge